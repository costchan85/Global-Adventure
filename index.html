            padding: 15px;

            gap: 10px;
            max-height: 680px;

        .sidebar-title { font-size: 16px; color: #f1c40f; border-bottom: 2px solid #f1c40f; padding-bottom: 6px; }

            display: grid;
            grid-template-columns: repeat(11, 56px);
            grid-template-rows: repeat(11, 56px);
            gap: 2px;
            background: #0f3460;
            padding: 6px;
            border-radius: 12px;
            border: 3px solid #f1c40f;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }

        .cell {
            background-color: #34495e;
            border-radius: 4px;
            font-size: 10px;
            line-height: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 2px;
            color: white;
            user-select: none;
            word-break: break-all;
            overflow: hidden;
        }

        .cell-flag-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.28;
            z-index: 1;
        }

        .cell-text {
            position: relative;
            z-index: 2;
            font-weight: bold;
            text-shadow: 1px 1px 3px #000, -1px -1px 3px #000;
        }

        .center-area {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background: #16213e;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f1c40f;
            font-size: 22px;
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('Gemini_Generated_Image_mi4urgmi4urgmi4u.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.85;
            z-index: -1;

            text-shadow: 2px 2px 6px #000, -2px -2px 6px #000, 0 0 10px #000;

            background: rgba(0, 0, 0, 0.55);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(241, 196, 15, 0.5);

        .type-event { background: #8e44ad; }
        .type-special { background: #16a085; }
        .type-attraction { background: #d35400; }

        .token {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .token-p0 { background: #2ecc71; bottom: 2px; left: 2px; }
        .token-p1 { background: #e74c3c; bottom: 2px; right: 2px; }
        .token-p2 { background: #3498db; top: 2px; left: 2px; }
        .token-p3 { background: #f1c40f; top: 2px; right: 2px; }

        .btn-sec { background: #3498db; }
        .btn-sec:hover { background: #5dade2; }
        .btn-trade { background: #f39c12; }
        .btn-trade:hover { background: #f1c40f; }

        .player-card.is-me { border-right: 3px solid #2ecc71; }
        
        .action-box { background: #16213e; border: 2px solid #f1c40f; padding: 12px; border-radius: 8px; }

        .dice-display { text-align: center; font-size: 16px; background: #1a1a2e; padding: 6px; border-radius: 8px; border: 1px solid #e94560; font-weight: bold; color: #f1c40f; }
        
        .card-tag { background: #34495e; color: #fff; border: 1px solid #f1c40f; border-radius: 4px; padding: 2px 5px; font-size: 10px; margin: 2px; display: inline-block; }
        .skill-tag { background: #27ae60; color: #fff; border-radius: 4px; padding: 2px 5px; font-size: 10px; margin: 2px; display: inline-block; }
        .inventory-tag { background: #e67e22; color: #fff; border-radius: 4px; padding: 2px 5px; font-size: 10px; margin: 2px; display: inline-block; }

        .modal { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #0f3460; padding: 20px; border-radius: 12px; border: 2px solid #f1c40f; width: 400px; max-height: 90vh; overflow-y: auto; }
        select, input { width: 100%; padding: 8px; margin: 6px 0; background: #1a1a2e; color: #fff; border: 1px solid #3498db; border-radius: 4px; }
        .trade-flex { display: flex; gap: 10px; justify-content: space-between; }
        .trade-box { flex: 1; background: #16213e; padding: 8px; border-radius: 6px; font-size: 12px; }
        .trade-review-box { background: #16213e; border: 1px solid #3498db; padding: 10px; border-radius: 6px; font-size: 13px; margin: 10px 0; line-height: 1.6; }

            }

        async function joinRoom() {
            myPlayerName = document.getElementById("playerNameInput").value.trim() || "玩家";
            const inputCode = document.getElementById("roomCodeInput").value.trim();

            if (!inputCode) { alert("請輸入 4 位數房間碼！"); return; }

            const roomRef = ref(db, `rooms/${inputCode}`);
            const snapshot = await get(roomRef);

            if (!snapshot.exists()) { alert("❌ 找不到此房間碼，請確認後重試！"); return; }

            const roomData = snapshot.val();

            if (roomData.status !== "waiting") { alert("⚠️ 該房間遊戲已經開始，無法加入！"); return; }
            if (roomData.players.length >= 4) { alert("⚠️ 該房間人數已滿 (最多 4 人)！"); return; }

            myPlayerId = roomData.players.length;
            isHost = false;
            currentRoomCode = inputCode;

            const newPlayer = {
                id: myPlayerId,
                name: myPlayerName,
                color: playerColors[myPlayerId],
                coins: 1000,
                pos: 0,
                cards: [],
                bond: 0,
                isFrozen: false,
                pendingStepAdjust: 0,
                inventory: [],

                hasTriggeredItaly: false
            };

            roomData.players.push(newPlayer);
            roomData.logs.push(`👋 ${myPlayerName} 加入了房間！`);

            await update(ref(db, `rooms/${currentRoomCode}`), {
                players: roomData.players,

            });

            document.getElementById("lobbyModal").style.display = "none";
            document.getElementById("waitingModal").style.display = "flex";

        async function startOnlineGame() {
            if (!isHost) return;
            const roomRef = ref(db, `rooms/${currentRoomCode}`);
            const snapshot = await get(roomRef);
            let roomData = snapshot.val();

            if (roomData.players.length < 2) {
                if (!confirm("目前只有 1 位玩家，確定要自己開始遊戲？")) return;
            }

            roomData.status = "playing";
            roomData.logs.push(`🚀 房長啟動了遊戲！共有 ${roomData.players.length} 位玩家對戰！`);

            await update(roomRef, {
                status: "playing",
                logs: roomData.logs
            });
        }

        function listenToRoomUpdates(code) {
            const roomRef = ref(db, `rooms/${code}`);
            onValue(roomRef, (snapshot) => {
                if (!snapshot.exists()) return;
                gameState = snapshot.val();

                if (!gameState.players) gameState.players = [];
                if (!gameState.logs) gameState.logs = [];
                if (!gameState.currentDeck) gameState.currentDeck = [];
                if (!gameState.discardPile) gameState.discardPile = [];

                renderWaitingList();

                if (gameState.status === "playing") {
                    document.getElementById("waitingModal").style.display = "none";
                    document.getElementById("roomHeaderTag").style.display = "inline-block";
                    document.getElementById("roomHeaderTag").innerText = `房間號：${currentRoomCode}`;
                    
                    updateBoardAndUI();
                    checkTradeModalState();
                }
            });
        }

                div.id = `cell-${cell.id}`;
                div.style.gridRow = cell.r;
                div.style.gridColumn = cell.c;

                if (cell.type === "country" && countryCardDatabase[cell.country]) {
                    const countryCode = countryCardDatabase[cell.country].code;
                    const flagBg = document.createElement("div");
                    flagBg.className = "cell-flag-bg";
                    flagBg.style.backgroundImage = `url('https://flagcdn.com/w160/${countryCode}.png')`;
                    div.appendChild(flagBg);
                }

                const textSpan = document.createElement("span");
                textSpan.className = "cell-text";
                textSpan.innerText = cell.name;
                div.appendChild(textSpan);

                grid.appendChild(div);

        function checkHasFullSet(player, countryName) {
            if (!player || !player.cards) return false;
            const countryCards = player.cards.filter(c => c.country === countryName);
            return countryCards.length === 3;
        }

        function getUnlockedCountries(player) {
            if (!player) return [];
            return Object.keys(countryCardDatabase).filter(cName => checkHasFullSet(player, cName));
        }

        window.handleRollOnline = async function() {
            if (gameState.turn !== myPlayerId) return;

            let p = gameState.players[myPlayerId];

            if (p.isFrozen) {
                gameState.logs.push(`❄️ ${p.name} 正處於扣留/凍結狀態，本回合無法移動！`);
                p.isFrozen = false;
                await endTurnOnline();
                return;
            }

            let d1 = Math.floor(Math.random() * 6) + 1;
            let d2 = Math.floor(Math.random() * 6) + 1;
            let rawStep = d1 + d2;

            if (checkHasFullSet(p, "巴西") && d1 === d2 && gameState.strikeTurnCount === 0) {
                showBrazilChoiceUI(p, d1, rawStep);
                return;
            }

            let finalStep = rawStep;
            let diceDisplayText = "";

            if (gameState.strikeTurnCount > 0) {
                finalStep = d1;
                gameState.strikeTurnCount--;
                diceDisplayText = `⚠️ 罷工影響 (1D6): [${d1}] = ${finalStep} 點`;
                gameState.logs.push(`⚠️ ${p.name} 受到【罷工】影響，僅能使用 1 顆骰子 (骰出: ${d1} 點)！`);
            } else {
                diceDisplayText = `🎲 擲出: [${d1}] + [${d2}] = ${rawStep} 點`;
            }

            await executeMoveOnline(p, finalStep, diceDisplayText);
        }

        function showBrazilChoiceUI(player, d1, rawStep) {
            const title = document.getElementById("actionTitle");
            const desc = document.getElementById("actionDesc");
            const btns = document.getElementById("actionBtns");
            btns.innerHTML = "";

            title.innerText = "🇧🇷 森巴狂歡觸發！";
            desc.innerText = `🎲 您擲出了對子 [${d1}] + [${d1}]！請選擇步數：`;

            btns.appendChild(createButton(`僅前進 ${d1} 步`, "btn", async () => {
                await executeMoveOnline(player, d1, `🇧🇷 森巴狂歡: [${d1}] = ${d1} 點`);
            }));
            btns.appendChild(createButton(`前進 ${rawStep} 步`, "btn btn-sec", async () => {
                await executeMoveOnline(player, rawStep, `🎲 雙骰總和: [${d1}] + [${d1}] = ${rawStep} 點`);
            }));
        }

        async function executeMoveOnline(player, baseStep, diceDisplayText) {
            let finalStep = baseStep;

            if (player.pendingStepAdjust && player.pendingStepAdjust !== 0) {
                let adj = player.pendingStepAdjust;
                finalStep += adj;
                diceDisplayText += ` 🇬🇧 (大笨鐘 ${adj > 0 ? '+'+adj : adj} = ${finalStep} 點)`;
                player.pendingStepAdjust = 0;
            }

            document.getElementById("diceResult").innerText = diceDisplayText;
            gameState.logs.push(`➡️ <strong>${player.name}</strong> 最終前進 ${finalStep} 步！`);

            let oldPos = player.pos;
            player.pos = (player.pos + finalStep) % 40;

            if (player.pos < oldPos) {
                grantStartReward(player);
            }

            handleGridActionOnline(player, boardData[player.pos]);
        }

        function grantStartReward(player) {
            let reward = checkHasFullSet(player, "美國") ? 400 : 200;
            player.coins += reward;
            if (checkHasFullSet(player, "美國")) {
                gameState.logs.push(`🇺🇸 【矽谷投資】發動！獲得雙倍起點獎勵 400 哩程幣！`);
            } else {
                gameState.logs.push(`🎉 經過起點！獲得 200 哩程幣補貼。`);
            }
        }

        function handleGridActionOnline(player, grid) {
            const title = document.getElementById("actionTitle");
            const desc = document.getElementById("actionDesc");
            const btns = document.getElementById("actionBtns");
            btns.innerHTML = "";

            title.innerText = `降落：${grid.name}`;

            if (grid.type === "country") {
                const cName = grid.country;
                let otherOwners = gameState.players.filter(p => p.id !== player.id && (p.cards||[]).some(c => c.country === cName));
                
                if (otherOwners.length > 0) {
                    let opponent = otherOwners[0];
                    let opponentCardsInCountry = opponent.cards.filter(c => c.country === cName);
                    
                    if (checkHasFullSet(player, "俄羅斯")) {
                        gameState.logs.push(`🇷🇺 【西伯利亞鐵路】發動：${player.name} 免付過路費！`);
                    } else {
                        let toll = opponentCardsInCountry.length === 3 ? (cName === "沙地阿拉伯" ? 200 : 100) : 30;
                        player.coins -= toll;
                        opponent.coins += toll;
                        gameState.logs.push(`🏠 停留在 ${opponent.name} 的【${cName}】，支付過路費 ${toll} 哩程幣！`);
                    }
                }

                const takenKeys = getTakenCardKeys();
                let availableCards = countryCardDatabase[cName].cards.filter(c => !takenKeys.includes(`${cName}-${c.type}`));

                if (availableCards.length > 0) {
                    let targetCard = availableCards[0];
                    let cost = checkHasFullSet(player, "德國") ? 70 : 100;
                    if ((player.inventory||[]).includes("語言天賦爆發")) { cost = 50; }

                    desc.innerText = `【${cName}】未發行卡片：[${targetCard.type}：${targetCard.name}]\n售價：${cost} 哩程幣`;
                    btns.appendChild(createButton(`購買元素卡 (${cost}幣)`, "btn", async () => {
                        if((player.inventory||[]).includes("語言天賦爆發")) {
                            player.inventory = player.inventory.filter(i => i !== "語言天賦爆發");
                            let langCard = baseChanceCards.find(c => c.title === "語言天賦爆發");
                            if (langCard) gameState.discardPile.push(langCard);
                        }
                        await buyCardOnline(cName, targetCard.type, targetCard.name, cost);
                    }));
                    btns.appendChild(createButton("放棄", "btn btn-sec", endTurnOnline));
                } else {
                    desc.innerText = `【${cName}】的所有元素卡皆已售出。`;
                    btns.appendChild(createButton("確認", "btn", endTurnOnline));
                }
            } else if (grid.type === "event" || grid.name === "旅遊黑店") {
                if (grid.name === "旅遊黑店") {
                    player.coins -= 100;
                    gameState.logs.push(`⚠️ ${player.name} 在旅遊黑店損失 100 哩程幣！`);
                    desc.innerText = `遇上旅遊黑店，被強迫消費 100 哩程幣！`;
                    btns.appendChild(createButton("確認", "btn", endTurnOnline));
                } else {
                    let card1 = drawCardFromDeckOnline();
                    if (!card1) {
                        desc.innerText = `🎴 牌堆已全數抽完。`;
                        btns.appendChild(createButton("確認", "btn", endTurnOnline));
                        return;
                    }

                    if (checkHasFullSet(player, "印度")) {
                        let card2 = drawCardFromDeckOnline();
                        if (!card2) {
                            desc.innerText = `🇮🇳 【瑜伽冥想】僅剩一張牌：【${card1.title}】\n"${card1.desc}"`;
                            btns.appendChild(createButton("執行效果", "btn", async () => { await executeChanceCardOnline(player, card1, null); }));
                        } else {
                            desc.innerText = `🇮🇳 【瑜伽冥想】抽出兩張牌，請選擇一張執行：\n1. [${card1.title}]\n2. [${card2.title}]`;
                            btns.appendChild(createButton(`執行 [${card1.title}]`, "btn", async () => { await executeChanceCardOnline(player, card1, card2); }));
                            btns.appendChild(createButton(`執行 [${card2.title}]`, "btn", async () => { await executeChanceCardOnline(player, card2, card1); }));
                        }
                    } else {
                        desc.innerText = `🎴 抽到命運卡：【${card1.title}】\n"${card1.desc}"`;
                        
                        // 🛠️ 修正：若為迷路探險 (id === 4)，僅渲染選擇按鈕，不在此立刻結束回合
                        if (chosenCardIsChoice(card1)) {
                            renderChoiceCardUI(player, card1);
                        } else {
                            btns.appendChild(createButton("執行卡片效果", "btn", async () => { await executeChanceCardOnline(player, card1, null); }));
                        }
                    }
                }
            } else {
                desc.innerText = `安全區域。`;
                btns.appendChild(createButton("結束回合", "btn", endTurnOnline));
            }
        }

        function chosenCardIsChoice(card) {
            return card && card.id === 4;
        }

        // 🛠️ 修正：「迷路探險」專屬介面渲染（點擊按鈕後才觸發移動與 endTurnOnline）
        function renderChoiceCardUI(player, card) {
            const desc = document.getElementById("actionDesc");
            const btns = document.getElementById("actionBtns");
            btns.innerHTML = "";

            desc.innerText = `🧭 【${card.title}】：請選擇您要前進還是後退 2 格：`;

            btns.appendChild(createButton("⬅️ 後退 2 格", "btn btn-sec", async () => {
                player.pos = (player.pos - 2 + 40) % 40;
                gameState.logs.push(`🧭 ${player.name} 選擇後退 2 格！`);
                if (!card.keepable) gameState.discardPile.push(card);
                await endTurnOnline();
            }));

            btns.appendChild(createButton("➡️ 前進 2 格", "btn", async () => {
                player.pos = (player.pos + 2) % 40;
                gameState.logs.push(`🧭 ${player.name} 選擇前進 2 格！`);
                if (!card.keepable) gameState.discardPile.push(card);
                await endTurnOnline();
            }));
        }

        function getTakenCardKeys() {
            let takenKeys = [];
            if (!gameState || !gameState.players) return [];
            gameState.players.forEach(p => {
                if (p.cards) {
                    p.cards.forEach(c => takenKeys.push(`${c.country}-${c.type}`));
                }
            });
            return takenKeys;
        }

        function drawCardFromDeckOnline() {
            if (!gameState.currentDeck || gameState.currentDeck.length === 0) {
                if (!gameState.discardPile || gameState.discardPile.length === 0) return null;
                gameState.logs.push("🔄 抽牌堆已用盡，自動將棄牌堆重新洗牌！");
                gameState.currentDeck = shuffle(gameState.discardPile);
                gameState.discardPile = [];
            }
            return gameState.currentDeck.pop();
        }

        async function executeChanceCardOnline(player, chosenCard, unchosenCard) {
            if (unchosenCard && !unchosenCard.keepable) {
                gameState.discardPile.push(unchosenCard);
            }

            // 🛠️ 若為選擇題型卡片，交由專屬 UI 處理，暫停自動結算
            if (chosenCardIsChoice(chosenCard)) {
                renderChoiceCardUI(player, chosenCard);
                return;
            }

            if (chosenCard.id === 1) { player.pos = (player.pos + 3) % 40; }
            else if (chosenCard.id === 2) { player.pos = 5; player.isFrozen = true; }
            else if (chosenCard.id === 3) { player.coins += 150; }
            else if (chosenCard.id === 5) { gameState.strikeTurnCount = gameState.players.length; }
            else if (chosenCard.id === 6) { player.coins += getUnlockedCountries(player).length * 100; }
            else if (chosenCard.id === 7) { gameState.players.forEach(o => { if(o.id !== player.id){ o.coins -= 30; player.coins += 30; } }); }
            else if (chosenCard.id === 8) { player.coins -= 80; }
            else if (chosenCard.id === 9) { player.inventory = player.inventory || []; player.inventory.push("語言天賦爆發"); }
            else if (chosenCard.id === 10) { player.coins += 200; }
            else if (chosenCard.id === 11) { player.coins += 150; }
            else if (chosenCard.id === 12) { player.coins -= 80; }
            else if (chosenCard.id === 13) { 
                let total = gameState.players.reduce((sum, item) => sum + item.coins, 0); 
                let avg = Math.floor(total / gameState.players.length); 
                gameState.players.forEach(item => item.coins = avg); 
            }
            else if (chosenCard.id === 14) { player.coins += 250; }
            else if (chosenCard.id === 15) { player.pos = 19; }

            if (!chosenCard.keepable) {
                gameState.discardPile.push(chosenCard);
            }

            gameState.logs.push(`🎴 執行了【${chosenCard.title}】效果。`);
            await endTurnOnline();
        }

        async function buyCardOnline(country, type, name, cost) {
            let p = gameState.players[myPlayerId];
            if (p.coins >= cost) {
                p.coins -= cost;
                p.cards = p.cards || [];
                p.cards.push({ country: country, type: type, name: name });
                gameState.logs.push(`🛒 ${p.name} 購買了 [${country}] 的【${type}：${name}】！`);
            }
            await endTurnOnline();
        }

        function createButton(text, className, onClickFunc) {
            const btn = document.createElement("button");
            btn.className = className;
            btn.innerText = text;

            if (gameState.turn !== myPlayerId) {
                btn.disabled = true;
            } else {
                btn.onclick = onClickFunc;
            }
            return btn;
        }

        async function endTurnOnline() {
            let p = gameState.players[myPlayerId];

            if (checkHasFullSet(p, "瑞士")) {
                p.coins += 100;
                gameState.logs.push(`🇨🇭 【瑞士銀行】發動：${p.name} 獲得 +100 哩程幣！`);
            }

            p.hasUsedSkillThisTurn = false;
            gameState.turn = (gameState.turn + 1) % gameState.players.length;

            document.getElementById("actionBtns").innerHTML = "";

            await update(ref(db, `rooms/${currentRoomCode}`), gameState);
        }

        function updateTradeModalOptions() {
            if (!gameState || !gameState.players) return;

            let myPlayer = gameState.players[myPlayerId];
            let targetId = parseInt(document.getElementById("tradeTargetPlayerSelect").value);
            
            let opponent = gameState.players.find(p => p.id === targetId);

            if (!opponent) {
                opponent = gameState.players.find(p => p.id !== myPlayerId);
            }

            if (!opponent) return;

            document.getElementById("initiatorName").innerText = `${myPlayer.name} (您) 支付`;
            document.getElementById("targetName").innerText = `${opponent.name} 支付`;

            const mySelect = document.getElementById("myTradeCardSelect");
            mySelect.innerHTML = `<option value="-1">不提供卡片</option>`;
            if (myPlayer.cards && myPlayer.cards.length > 0) {
                myPlayer.cards.forEach((c, idx) => {
                    mySelect.innerHTML += `<option value="${idx}">[${c.country}] ${c.type}:${c.name}</option>`;
                });
            }

            const targetSelect = document.getElementById("targetTradeCardSelect");
            targetSelect.innerHTML = `<option value="-1">不要求卡片</option>`;
            if (opponent.cards && opponent.cards.length > 0) {
                opponent.cards.forEach((c, idx) => {
                    targetSelect.innerHTML += `<option value="${idx}">[${c.country}] ${c.type}:${c.name}</option>`;
                });
            }
        }

        async function submitTradeOfferOnline() {
            let targetId = parseInt(document.getElementById("tradeTargetPlayerSelect").value);
            let myCardIdx = parseInt(document.getElementById("myTradeCardSelect").value);
            let targetCardIdx = parseInt(document.getElementById("targetTradeCardSelect").value);

            let myCoin = parseInt(document.getElementById("myTradeCoin").value) || 0;
            let targetCoin = parseInt(document.getElementById("targetTradeCoin").value) || 0;

            let p = gameState.players[myPlayerId];
            let opponent = gameState.players[targetId];

            let myCard = (myCardIdx !== -1 && p.cards) ? p.cards[myCardIdx] : null;
            let targetCard = (targetCardIdx !== -1 && opponent.cards) ? opponent.cards[targetCardIdx] : null;

            gameState.pendingTradeOffer = {
                fromId: p.id,
                toId: opponent.id,
                myCardIdx: myCardIdx,
                targetCardIdx: targetCardIdx,
                myCard: myCard,
                targetCard: targetCard,
                myCoin: myCoin,
                targetCoin: targetCoin
            };

            gameState.logs.push(`📩 ${p.name} 向 ${opponent.name} 發起了一項交易提案！`);
            document.getElementById("tradeModal").style.display = "none";

            await update(ref(db, `rooms/${currentRoomCode}`), gameState);
        }

        function checkTradeModalState() {
            if (!gameState || !gameState.pendingTradeOffer) {
                document.getElementById("tradeReviewModal").style.display = "none";
                return;
            }

            const offer = gameState.pendingTradeOffer;

            if (offer.toId === myPlayerId) {
                const fromP = gameState.players[offer.fromId];
                document.getElementById("tradeReviewTitle").innerText = `${myPlayerName}，${fromP.name} 向您發起了交易請求！`;
                
                let giveText = `🎁 ${fromP.name} 願意給您：`;
                if (offer.myCard) giveText += `[${offer.myCard.country}] ${offer.myCard.type}:${offer.myCard.name} `;
                if (offer.myCoin > 0) giveText += `+ ${offer.myCoin} 哩程幣`;
                if (!offer.myCard && offer.myCoin === 0) giveText += `無`;

                let takeText = `💸 要求您支付：`;
                if (offer.targetCard) takeText += `[${offer.targetCard.country}] ${offer.targetCard.type}:${offer.targetCard.name} `;
                if (offer.targetCoin > 0) takeText += `+ ${offer.targetCoin} 哩程幣`;
                if (!offer.targetCard && offer.targetCoin === 0) takeText += `無`;

                document.getElementById("tradeGiveDetail").innerText = giveText;
                document.getElementById("tradeTakeDetail").innerText = takeText;
                document.getElementById("tradeReviewModal").style.display = "flex";
            } else {
                document.getElementById("tradeReviewModal").style.display = "none";
            }
        }

        async function acceptTradeOnline() {
            const offer = gameState.pendingTradeOffer;
            let fromP = gameState.players[offer.fromId];
            let toP = gameState.players[offer.toId];

            fromP.coins -= offer.myCoin; toP.coins += offer.myCoin;
            toP.coins -= offer.targetCoin; fromP.coins += offer.targetCoin;

            if (offer.myCard) {
                fromP.cards.splice(offer.myCardIdx, 1);
                toP.cards.push(offer.myCard);
            }
            if (offer.targetCard) {
                toP.cards.splice(offer.targetCardIdx, 1);
                fromP.cards.push(offer.targetCard);
            }

            gameState.logs.push(`🤝 交易成功！${toP.name} 同意了 ${fromP.name} 的交易提案。`);
            gameState.pendingTradeOffer = null;

            await update(ref(db, `rooms/${currentRoomCode}`), gameState);
        }

        async function rejectTradeOnline() {
            const offer = gameState.pendingTradeOffer;
            let toP = gameState.players[offer.toId];
            let fromP = gameState.players[offer.fromId];

            gameState.logs.push(`❌ ${toP.name} 拒絕了 ${fromP.name} 的交易提案！`);
            gameState.pendingTradeOffer = null;

            await update(ref(db, `rooms/${currentRoomCode}`), gameState);
        }

        window.onload = function() {
            document.getElementById("createRoomBtn").onclick = createRoom;
            document.getElementById("joinRoomBtn").onclick = joinRoom;
            document.getElementById("startOnlineGameBtn").onclick = startOnlineGame;
            document.getElementById("rollBtn").onclick = window.handleRollOnline;

            document.getElementById("tradeBtn").onclick = () => {
                const select = document.getElementById("tradeTargetPlayerSelect");
                select.innerHTML = "";
                const opponents = gameState.players.filter(p => p.id !== myPlayerId);
                opponents.forEach(p => {
                    select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
                });

                updateTradeModalOptions();
                document.getElementById("tradeModal").style.display = "flex";
            };

            document.getElementById("tradeTargetPlayerSelect").onchange = updateTradeModalOptions;
            document.getElementById("submitTradeBtn").onclick = submitTradeOfferOnline;
            document.getElementById("cancelTradeBtn").onclick = () => document.getElementById("tradeModal").style.display = "none";

            document.getElementById("acceptTradeBtn").onclick = acceptTradeOnline;
            document.getElementById("rejectTradeBtn").onclick = rejectTradeOnline;
        };
    </script>
</body>
</html>
